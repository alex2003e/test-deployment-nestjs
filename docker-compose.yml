version: '1'

services:

  nats-server:
    image: nats
    ports:
      - 4222:4222

  products-db:
      container_name: 'products_database'
      image: postgres:16.2
      restart: always
      volumes:
        - ./postgres:/var/lib/postgresql/data
      ports:
        - 5432:5432
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=123456
        - POSTGRES_DB=productsdb

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.85.0
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus exporter
    networks:
      - observability-net

  # Servicio 2: Prometheus
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - observability-net
    depends_on:
      - otel-collector

  # Servicio 3: Jaeger (Para visualizar trazas)
  jaeger:
    image: jaegertracing/all-in-one:1.48
    container_name: jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "14268:14268" # Jaeger collector
    networks:
      - observability-net

  # Servicio 4: Grafana
  grafana:
    image: grafana/grafana-oss:10.1.2
    container_name: grafana
    ports:
      - "3000:3000"
    
    environment:
      - GF_SECURITY_ADMIN_USER=admin # (Opcional, 'admin' es el por defecto)
      - GF_SECURITY_ADMIN_PASSWORD=admin #
    volumes:
      - ./grafana-provisioning/:/etc/grafana/provisioning/
    networks:
      - observability-net
    depends_on:
      - prometheus
      - jaeger

  # Aquí deberías añadir tus servicios de NestJS (client-gateway y products-ms)
  # para que se levanten con Docker y se conecten a la misma red.
  # Por ahora, los ejecutaremos localmente para simplificar la configuración.

networks:
  observability-net:
    driver: bridge